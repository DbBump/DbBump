name: CI

# This workflow builds, tests and packs the code. It does not push packages or create releases.
# To create a draft release, run the -Create Release- workflow manually.

on:
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - 'release/**'
      - main
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Avoid pre-populating the NuGet package cache

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # all

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0

      - name: Display SemVer
        run: |
          echo "SemVer: $env:GitVersion_SemVer"

      - name: Restore
        run: dotnet restore DbUp.sln
        working-directory: src

      - name: Build
        run: dotnet build -c Release --no-restore /p:Version=$env:GitVersion_SemVer DbUp.sln
        working-directory: src

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --logger "console;verbosity=detailed" --results-directory ../artifacts/TestResults DbUp.sln
        working-directory: src

      - name: Pack
        run: dotnet pack --no-build -c Release -o ../artifacts /p:Version=$env:GitVersion_SemVer DbUp.sln
        working-directory: src

      # https://github.com/dorny/test-reporter#recommended-setup-for-public-repositories
      - name: Upload Test Results
        uses: actions/upload-artifact@v4 # upload test results
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results
          path: artifacts/TestResults/*.trx

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
