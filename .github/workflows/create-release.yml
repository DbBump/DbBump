name: Create Release

# Run this workflow manually on main or a release/** branch to create a draft GitHub release with the packages.
# Publishing the draft release starts the -Publish DbBump Packages to NuGet- workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Avoid pre-populating the NuGet package cache

    steps:
      - name: Check Branch
        if: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
        run: |
          echo "Releases can only be created from main or release/** branches."
          exit 1

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # all

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0

      - name: Display SemVer
        run: |
          echo "SemVer: $env:GitVersion_SemVer"

      - name: Restore
        run: dotnet restore DbUp.sln
        working-directory: src

      - name: Build
        run: dotnet build -c Release --no-restore /p:Version=$env:GitVersion_SemVer DbUp.sln
        working-directory: src

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --logger "console;verbosity=detailed" --results-directory ../artifacts/TestResults DbUp.sln
        working-directory: src

      - name: Pack
        run: dotnet pack --no-build -c Release -o ../artifacts /p:Version=$env:GitVersion_SemVer DbUp.sln
        working-directory: src

      # https://github.com/dorny/test-reporter#recommended-setup-for-public-repositories
      - name: Upload Test Results
        uses: actions/upload-artifact@v4 # upload test results
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results
          path: artifacts/TestResults/*.trx

      - name: Create GitHub Release
        shell: pwsh
        working-directory: artifacts
        # Can't just use wildcard in this command due to https://github.com/cli/cli/issues/5099 so use Get-Item
        run: gh release create --draft ${{ github.ref_name == 'main' && '' || '--prerelease' }} --target ${{ github.ref_name }} --title $env:GitVersion_SemVer $env:GitVersion_SemVer (Get-Item dbbump-core.*.nupkg)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
